<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>كلمات اللغة القبطية</title>
  <style>
    :root {
      --masc: #1d4ed8;
      --verb: #059669;
    }
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #f8fafc;
      color: #111827;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", Arial, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
    }
    h1 { font-size: 1.6rem; margin: 0; font-weight: 800; text-align: center; }
    p.sub { margin: 0; color: #6b7280; text-align: center; }
    .cards {
      display: grid;
      gap: 18px;
      width: 100%;
      max-width: 420px;
    }
    a.level {
      display: block;
      text-decoration: none;
      color: white;
      padding: 28px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 18px rgba(0,0,0,.15);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a.level:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,.22); }
    a.level .big { font-size: 1.5rem; font-weight: 800; }
    a.level .small { font-size: .95rem; opacity: .9; margin-top: 4px; }
    .l2 { background: linear-gradient(160deg, var(--masc), #3b82f6); }
    .l3 { background: linear-gradient(160deg, var(--verb), #10b981); }
    footer { color: #9ca3af; font-size: .8rem; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1>كلمات اللغة القبطية</h1>
      <p class="sub">اختر المستوى للبدء في المذاكرة</p>
    </div>

    <div class="cards">
      <a class="level l2" href="./level2/">
        <div class="big">المستوى الثاني</div>
        <div class="small">بطاقات كلمات المستوى الثاني ◀</div>
      </a>
      <a class="level l3" href="./level3/">
        <div class="big">المستوى الثالث</div>
        <div class="small">بطاقات كلمات المستوى الثالث ◀</div>
      </a>
    </div>
  </div>
</body>
</html>
