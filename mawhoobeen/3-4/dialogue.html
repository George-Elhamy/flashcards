<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>حوار الموهوبين</title>
  <style>
    @font-face {
      font-family: "New Athanasius";
      src: url("../../NEWATH.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      --ink: #111111; --ink-light: #EDEDED; --card: #F7F7F7;
      --fg: #16192E; --muted: #6b7280; --radius: 20px;
      --border: rgba(0,0,0,.09);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; background: #FFFFFF; color: var(--fg);
      font-family: "Geeza Pro", "Damascus", "Al Bayan", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 100px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    header .titles { flex: 1; }
    header h1 { font-size: 1.3rem; margin: 0 0 4px; font-weight: 800; color: var(--ink); }
    header .source { font-size: .8rem; color: var(--muted); }

    .intro { text-align: center; color: var(--muted); font-size: .95rem; margin: 0 0 20px; }

    .scene {
      background: var(--card); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .scene-label {
      display: inline-block; font-size: .72rem; font-weight: 800; color: white;
      background: var(--ink); border-radius: 999px; padding: 3px 12px; margin-bottom: 12px;
    }

    .turn { padding: 8px 0; }
    .turn + .turn { border-top: 1px solid rgba(0,0,0,.07); margin-top: 2px; }
    .turn-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .turn-speaker { font-size: .8rem; font-weight: 700; color: var(--ink); }
    .speak-btn-sm {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: var(--ink-light); color: var(--ink);
      display: grid; place-items: center; cursor: pointer; flex-shrink: 0;
    }
    .speak-btn-sm svg { width: 14px; height: 14px; }
    .speak-btn-sm.playing { background: var(--ink); color: white; }

    .line-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      align-items: center;
      direction: ltr;
    }
    .line-coptic {
      font-family: "New Athanasius", serif;
      unicode-bidi: isolate; text-align: left;
      line-height: 1.7; font-size: 1.5rem; color: var(--ink);
    }
    .line-arabic {
      direction: rtl; unicode-bidi: isolate;
      text-align: right; line-height: 1.9; font-size: 1.15rem;
    }

    @media (max-width: 480px) {
      .line-row { grid-template-columns: 1fr; gap: 6px; direction: ltr; }
      .line-coptic, .line-arabic { text-align: center; }
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,.92); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 6px 8px max(6px, env(safe-area-inset-bottom));
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; color: var(--muted); font-size: .68rem; font-family: inherit;
      padding: 6px 16px; border-radius: 14px; transition: background .15s ease, color .15s ease;
    }
    .bottom-nav a svg { width: 22px; height: 22px; }
    .bottom-nav a.active { color: var(--ink); font-weight: 700; background: var(--ink-light); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="titles">
        <h1>حوار قصير</h1>
        <div class="source">موهوبين — مرحلة ثالثة ورابعة</div>
      </div>
    </header>
    <div id="dialogue"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-5.8-1.5-.7.1-1.2.7-1.2 1.4v10.8c0 .8.7 1.4 1.5 1.3 2-.2 4 .3 5.5 1.5 1.5-1.2 3.5-1.7 5.5-1.5.8.1 1.5-.5 1.5-1.3V6.4c0-.7-.5-1.3-1.2-1.4-2.2-.2-4.3.3-5.8 1.5Z"/><path d="M12 6.5V19"/></svg>
      كلمات
    </a>
    <a href="texts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="3.2" rx="1.6"/><rect x="6" y="17.8" width="12" height="3.2" rx="1.6"/><path d="M7.2 6.2v11.6"/><path d="M16.8 6.2v11.6"/><path d="M9.5 10.2h5"/><path d="M9.5 13.8h5"/></svg>
      نصوص
    </a>
    <a href="dialogue.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg>
      حوار
    </a>
  </nav>

  <script>
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const speakerIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
    const sceneNumerals = ['١', '٢', '٣', '٤', '٥', '٦'];

    let currentAudio = null;
    let currentBtn = null;
    function playAudio(src, btn) {
      if (currentAudio) currentAudio.pause();
      if (currentBtn) currentBtn.classList.remove('playing');
      currentAudio = new Audio(src);
      currentBtn = btn;
      btn.classList.add('playing');
      currentAudio.addEventListener('ended', () => btn.classList.remove('playing'));
      currentAudio.play().catch(() => btn.classList.remove('playing'));
    }

    async function init() {
      const container = document.getElementById('dialogue');
      const res = await fetch('data/dialogue.json', { cache: 'no-store' });
      const dialogue = await res.json();
      let turnNumber = 0;
      container.innerHTML = `
        <p class="intro">${escapeHtml(dialogue.title)}</p>
        ${dialogue.scenes.map((scene, i) => `
          <div class="scene">
            <span class="scene-label">حوار ${sceneNumerals[i] || i + 1}</span>
            ${scene.turns.map(t => {
              turnNumber++;
              const n = String(turnNumber).padStart(2, '0');
              return `
              <div class="turn">
                <div class="turn-head">
                  <div class="turn-speaker">${t.speaker ? escapeHtml(t.speaker) + ':' : ''}</div>
                  <button class="speak-btn-sm" data-audio="audio/dialogue/${n}.m4a" title="نطق العبارة">${speakerIcon}</button>
                </div>
                <div class="line-row">
                  <div class="line-coptic">${escapeHtml(t.coptic)}</div>
                  <div class="line-arabic">${escapeHtml(t.arabic)}</div>
                </div>
              </div>
            `;
            }).join('')}
          </div>
        `).join('')}
      `;
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('.speak-btn-sm');
        if (btn) playAudio(btn.dataset.audio, btn);
      });
    }
    init();
  </script>
</body>
</html>
