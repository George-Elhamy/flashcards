<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>كلمات الموهوبين</title>
  <style>
    @font-face {
      font-family: "New Athanasius";
      src: url("../../NEWATH.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      --ink: #111111; --ink-light: #EDEDED; --card: #F7F7F7;
      --maroon: #7A1F2B;
      --fg: #16192E; --muted: #6b7280; --radius: 20px;
      --border: rgba(0,0,0,.09);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; margin: 0; background: #FFFFFF; color: var(--fg);
      font-family: "Geeza Pro", "Damascus", "Al Bayan", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    .wrap {
      height: 100%; min-height: 100dvh; display: grid; grid-template-rows: auto auto 1fr auto;
      align-items: stretch; justify-items: center; gap: 14px;
      padding: 16px 16px 90px; box-sizing: border-box;
    }
    header { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 480px; gap: 10px; }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 800; color: var(--ink); }
    .progress { font-size: .85rem; color: var(--muted); }

    .mode {
      display: flex; gap: 2px; justify-content: center;
      background: var(--ink-light); border-radius: 999px; padding: 4px;
    }
    .mode button {
      border: none; padding: 8px 22px; border-radius: 999px;
      font-weight: 700; background: transparent; color: var(--ink);
      cursor: pointer; font-family: inherit; transition: background .18s ease, color .18s ease;
    }
    .mode button.active { background: var(--ink); color: white; box-shadow: 0 4px 10px rgba(0,0,0,.25); }

    .stage { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; }
    .card { width: min(78vw, 340px); height: min(52vh, 420px); perspective: 1200px; touch-action: manipulation; position: relative; border-radius: var(--radius); box-shadow: 0 14px 28px rgba(0,0,0,.2); }
    .card-inner { position: relative; width: 100%; height: 100%; transition: transform .5s ease; transform-style: preserve-3d; }
    .flipped .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
      box-sizing: border-box; border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      color: white; text-align: center;
      background: var(--maroon);
    }
    .front, .back { font-size: clamp(2rem, 5vw + 1rem, 3rem); line-height: 1.4; }
    .back { transform: rotateY(180deg); }
    #term, #translation { direction: ltr; unicode-bidi: isolate; display: inline-block; }

    .speak-btn {
      position: absolute; top: 12px; left: 12px; z-index: 2;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,.22); border: none; color: white;
      display: grid; place-items: center; cursor: pointer;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .speak-btn svg { width: 18px; height: 18px; }
    .card:not(.flipped) .back .speak-btn { visibility: hidden; }
    .card.flipped .front .speak-btn { visibility: hidden; }
    .speak-btn.playing { background: #000; }

    .controls { display: flex; justify-content: space-between; width: 100%; max-width: 480px; gap: 12px; direction: ltr; }
    .nav-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 13px 18px; font-size: .95rem; font-weight: 700;
      border: none; border-radius: 14px; color: var(--ink); direction: ltr;
      background: var(--ink-light); cursor: pointer; font-family: inherit;
      transition: background .15s ease, color .15s ease;
    }
    .nav-btn:hover { background: var(--ink); color: white; }
    .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,.92); backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 6px 8px max(6px, env(safe-area-inset-bottom));
    }
    .bottom-nav a {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; color: var(--muted); font-size: .68rem; font-family: inherit;
      padding: 6px 16px; border-radius: 14px; transition: background .15s ease, color .15s ease;
    }
    .bottom-nav a svg { width: 22px; height: 22px; }
    .bottom-nav a.active { color: var(--ink); font-weight: 700; background: var(--ink-light); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>كلمات الموهوبين</h1>
      <div class="progress" id="progress">1 / 1</div>
    </header>

    <div class="mode">
      <button id="alpha" class="active">عربي</button>
      <button id="aleph">قبطي</button>
    </div>

    <div class="stage">
      <div class="card" id="card" aria-live="polite">
        <div class="card-inner" id="cardInner">
          <section class="face front" id="front">
            <button class="speak-btn" id="speakBtnFront" title="نطق الكلمة القبطية (قريباً)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
            </button>
            <div id="term"></div>
          </section>
          <section class="face back" id="back">
            <button class="speak-btn" id="speakBtnBack" title="نطق الكلمة القبطية (قريباً)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
            </button>
            <div id="translation"></div>
          </section>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prev" class="nav-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        السابق
      </button>
      <button id="next" class="nav-btn">
        التالي
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5c-1.5-1.2-3.6-1.7-5.8-1.5-.7.1-1.2.7-1.2 1.4v10.8c0 .8.7 1.4 1.5 1.3 2-.2 4 .3 5.5 1.5 1.5-1.2 3.5-1.7 5.5-1.5.8.1 1.5-.5 1.5-1.3V6.4c0-.7-.5-1.3-1.2-1.4-2.2-.2-4.3.3-5.8 1.5Z"/><path d="M12 6.5V19"/></svg>
      كلمات
    </a>
    <a href="texts.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="3.2" rx="1.6"/><rect x="6" y="17.8" width="12" height="3.2" rx="1.6"/><path d="M7.2 6.2v11.6"/><path d="M16.8 6.2v11.6"/><path d="M9.5 10.2h5"/><path d="M9.5 13.8h5"/></svg>
      نصوص
    </a>
    <a href="dialogue.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg>
      حوار
    </a>
  </nav>

  <script>
    let CARDS = [];
    let idx = 0;
    let order = [];
    let showArabicFirst = true;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const elCard = document.getElementById('card');
    const elInner = document.getElementById('cardInner');
    const elFront = document.getElementById('front');
    const elBack = document.getElementById('back');
    const elTerm = document.getElementById('term');
    const elTrans = document.getElementById('translation');
    const elProgress = document.getElementById('progress');
    const btnPrev = document.getElementById('prev');
    const btnNext = document.getElementById('next');
    const btnAlpha = document.getElementById('alpha');
    const btnAleph = document.getElementById('aleph');
    const speakBtnFront = document.getElementById('speakBtnFront');
    const speakBtnBack = document.getElementById('speakBtnBack');

    function updateProgress() {
      elProgress.textContent = `${idx + 1} / ${order.length}`;
    }

    let currentCardIndex = 0;

    function showCard(i) {
      currentCardIndex = order[i];
      const c = CARDS[order[i]];
      if (showArabicFirst) {
        elTerm.textContent = c.arabic;
        elTrans.textContent = c.coptic;
        elTerm.style.fontFamily = '';
        elTrans.style.fontFamily = '"New Athanasius", serif';
        speakBtnFront.style.display = 'none';
        speakBtnBack.style.display = '';
      } else {
        elTerm.textContent = c.coptic;
        elTrans.textContent = c.arabic;
        elTerm.style.fontFamily = '"New Athanasius", serif';
        elTrans.style.fontFamily = '';
        speakBtnFront.style.display = '';
        speakBtnBack.style.display = 'none';
      }
      elInner.style.transition = "none";
      elCard.classList.remove("flipped");
      void elCard.offsetWidth;
      elInner.style.transition = "";
      updateProgress();
    }

    function flip() { elCard.classList.toggle('flipped'); }
    function next() { idx = (idx + 1) % order.length; showCard(idx); }
    function prev() { idx = (idx - 1 + order.length) % order.length; showCard(idx); }

    elCard.addEventListener('click', (e) => {
      if (e.target.closest('.speak-btn')) return;
      flip();
    });
    btnNext.addEventListener('click', next);
    btnPrev.addEventListener('click', prev);
    let currentAudio = null;
    let currentBtn = null;
    function playAudio(src, btn) {
      if (currentAudio) currentAudio.pause();
      if (currentBtn) currentBtn.classList.remove('playing');
      currentAudio = new Audio(src);
      currentBtn = btn;
      btn.classList.add('playing');
      currentAudio.addEventListener('ended', () => btn.classList.remove('playing'));
      currentAudio.play().catch(() => btn.classList.remove('playing'));
    }

    [speakBtnFront, speakBtnBack].forEach(btn => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const n = String(currentCardIndex + 1).padStart(2, '0');
      playAudio(`audio/vocab/${n}.m4a`, btn);
    }));

    btnAlpha.addEventListener('click', () => {
      showArabicFirst = true;
      btnAlpha.classList.add('active'); btnAleph.classList.remove('active');
      showCard(idx);
    });
    btnAleph.addEventListener('click', () => {
      showArabicFirst = false;
      btnAleph.classList.add('active'); btnAlpha.classList.remove('active');
      showCard(idx);
    });

    async function init() {
      const res = await fetch('data/vocab.json', { cache: 'no-store' });
      CARDS = await res.json();
      order = shuffle(CARDS.map((_, i) => i));
      showCard(idx);
    }
    init();
  </script>
</body>
</html>
